```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-size: 20px;
            font-family: Arial, sans-serif;
            color: white;
            text-transform: uppercase;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: 50px auto;
            border: 5px solid #333;
            box-sizing: border-box;
            padding: 5px;

            display: grid;
            grid-template-areas:
                "header header"
                "aside main"
                "footer footer";

            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        header {
            grid-area: header;
            background-color: #066D3B;
            padding: 20px 0;
        }

        aside {
            grid-area: aside;
            background-color: #293F7F;
            padding: 60px 0;
        }

        nav {
            grid-area: nav;
            background-color: #E45765;
            padding: 100px 0;
        }

        main {
            grid-area: main;
            background-color: #E0AA77;
            box-sizing: border-box;
            flex: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            grid-area: footer;
            background-color: #666;
            padding: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>Header</header>
        <aside>Aside</aside>
        <nav>Nav</nav>
        <main>Main</main>
        <footer>Footer</footer>
    </div>
</body>
</html>
